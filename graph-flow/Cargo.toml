[package]
name = "graph-flow"
version = "0.8.1"
edition = "2024"
authors = ["Alon Agmon"]
description = "A high-performance, type-safe framework for building multi-agent workflow systems in Rust"
homepage = "https://github.com/a-agmon/rs-graph-llm"
repository = "https://github.com/a-agmon/rs-graph-llm"
documentation = "https://docs.rs/graph-flow"
readme = "README.md"
license = "MIT"
keywords = ["ai", "agents", "workflow", "graph", "llm"]
categories = ["science", "algorithms", "asynchronous"]
exclude = [
    "examples/*",
    "target/*",
    ".git/*",
    "tests/*",
]

[dependencies]
# The library itself needs only `rt` (JoinSet) and `time` (timeout). `full`
# pulled net/process/fs/signal/io into every consumer; the macro and
# multi-thread runtime features used by tests and doc examples live under
# [dev-dependencies]. Examples and the service crates opt into `full` themselves.
tokio = { version = "1.40", default-features = false, features = ["rt", "time"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "2.0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
dashmap = "6.1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8.6", optional = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
# Not inherited from the workspace: this crate needs only `completion::Message`,
# and cargo ignores `default-features = false` on an inherited dependency. Opting
# out keeps rig-core's `derive` (proc-macro) and `reqwest`/`rustls` defaults out of
# downstream builds that enable graph-flow's `rig` feature. The workspace's service
# crates declare rig-core themselves and still get the defaults.
rig-core = { version = "0.42", optional = true, default-features = false }

[dev-dependencies]
# `#[tokio::test]` and the `#[tokio::main]` doc examples need these; consumers don't.
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]
rig = ["dep:rig-core"]